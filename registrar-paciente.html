<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar paciente — Clínica</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="marca">Clínica Vitalis</div>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a href="pacientes.html" class="activo">Pacientes</a>
          <a href="citas.html">Citas</a>
        </nav>
        <div class="usuario">
          Conectado como<br /><strong>Admin</strong><br />
          <a href="index.html">Cerrar sesión</a>
        </div>
      </aside>

      <main class="contenido">
        <div class="encabezado-pagina">
          <div>
            <h1>Registrar paciente</h1>
            <p>Completá los datos para agregar un nuevo paciente al sistema.</p>
          </div>
        </div>

        <div class="tarjeta">
          <form class="formulario" action="pacientes.html" method="get">
            <div class="fila-campos">
              <div class="campo">
                <label for="nombre">Nombres (*)</label>
                <input
                  type="text"
                  id="nombre"
                  name="nombre"
                  placeholder="Ej. Renato"
                  required
                />
              </div>
              <div class="campo">
                <label for="apellido">Apellidos (*)</label>
                <input
                  type="text"
                  id="apellido"
                  name="apellido"
                  placeholder="Ej. Aguilar"
                  required
                />
              </div>
            </div>

            <div class="fila-campos">
              <div class="campo">
                <label for="fecha-nacimiento">Fecha de nacimiento (*)</label>
                <input
                  type="date"
                  id="fecha-nacimiento"
                  name="fecha-nacimiento"
                  required
                />
              </div>
              <div class="campo">
                <label for="genero">Género</label>
                <select id="genero" name="genero">
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                  <option value="otro">Otro / prefiero no decir</option>
                </select>
              </div>
            </div>

            <div class="fila-campos">
              <div class="campo campo-obligatorio">
                <label for="telefono">Teléfono (*)</label>
                <input
                  type="tel"
                  id="telefono"
                  name="telefono"
                  placeholder="+591 700-00000"
                  required
                />
              </div>
              <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input
                  type="email"
                  id="correo"
                  name="correo"
                  placeholder="paciente@correo.com"
                />
              </div>
            </div>

            <div class="campo">
              <label for="tipo-sangre">Tipo de sangre</label>
              <select id="tipo-sangre" name="tipo-sangre">
                <option>O+</option>
                <option>O-</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
              </select>
            </div>

            <div class="campo">
              <label for="alergias"
                >Alergias conocidas <span class="ayuda">(opcional)</span></label
              >
              <textarea
                id="alergias"
                name="alergias"
                rows="3"
                placeholder="Ej. Penicilina, polen..."
              ></textarea>
            </div>

            <div class="acciones-formulario">
              <button type="submit" class="boton boton-primario">
                Guardar paciente
              </button>
              <a href="pacientes.html" class="boton boton-secundario"
                >Cancelar</a
              >
            </div>
          </form>
        </div>
        <span class="ayuda">(*) Campos obligatorios</span>
      </main>
    </div>
  </body>
</html>
