<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinica - Login</title>
    <link rel="stylesheet" href="css/styles.css">

  </head>
  <body>
    <div class="login-pantalla">
      <section class="login-panel-editorial">
        <div class="marca">Gestión Clínica</div>
        <p class="cita">
          "Un buen sistema no remplaza el cuidado del paciente, le hace lugar."
        </p>
        <p class="firma">Panel interno de gestión clinica</p>
      </section>

      <section class="login-panel-formulario">
        <div class="login-caja">
          <h1>Bienvenido de nuevo</h1>
          <p>Ingresa con tu cuenta para ver la agenda del día.</p>

          <form class="formulario" action="" method="">
            <div class="campo">
              <label for="correo">Correo electrónico</label>
              <input
                type="email"
                id="correo"
                name="correo"
                placeholder="nombre@correo.com"
                value="admin@correo.com"
                required
              />
            </div>
            <div class="campo">
              <label for="clave">Contraseña</label>
              <input
                type="password"
                id="clave"
                name="clave"
                placeholder="••••••••"
                value="vitalis123"
                required
              />
              <button
                type="submit"
                class="boton boton-primario"
                style="width: 100%"
              >
                Ingresar
              </button>
            </div>
          </form>
          <div class="nota-credenciales">
            Demo académica: usá <strong>admin@vitalis.com</strong> /
            <strong>vitalis123</strong>
            y presioná "Ingresar" para ver el dashboard.
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
